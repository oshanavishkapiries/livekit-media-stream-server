# LiveKit server configuration for the standalone VPS 1 deployment.
# Replace the dummy key pair before putting this into a real environment.

port: 7880

rtc:
  # UDP media ports used by LiveKit for WebRTC traffic.
  port_range_start: 50000
  port_range_end: 50100
  # TCP fallback for environments where UDP is constrained.
  tcp_port: 7881
  # Recommended for cloud/VPS deployment so LiveKit advertises the public node IP.
  use_external_ip: true

keys:
  devkey: devsecret
